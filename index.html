    --indigo:#3A2FB8;
    --indigo-dark:#211C6A;
    --purple:#8B5CF6;
    --cyan:#22D3EE;
    --dark:#0A0C22;
  }
  *{box-sizing:border-box;}
  html,body{background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; scroll-behavior:smooth;}
  .font-display{font-family:'Space Grotesk',sans-serif;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#D7DAF0;border-radius:8px;}
  ::-webkit-scrollbar-thumb:hover{background:#C0C4E8;}
  .aurora-text{background:linear-gradient(120deg,#3A2FB8,#8B5CF6 55%,#22D3EE);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .aurora-bg{background:linear-gradient(120deg,#3A2FB8,#8B5CF6 55%,#22D3EE);}
  .glass{background:rgba(255,255,255,0.7);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.6);}
  .glass-dark{background:rgba(10,12,34,0.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.08);}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;}
  .card-hover{transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;}
  .card-hover:hover{transform:translateY(-3px);box-shadow:0 16px 40px -18px rgba(58,47,184,0.35);border-color:#D9DBFA;}
  .btn-primary{background:linear-gradient(120deg,#3A2FB8,#5B4CD6);color:#fff;transition:filter .2s ease, transform .15s ease;}
  .btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px);}
  .btn-primary:active{transform:translateY(0);}
  .btn-ghost{background:#F1F1FB;color:var(--indigo-dark);transition:background .2s ease;}
  .btn-ghost:hover{background:#E5E5FA;}
  .chip{border:1px solid var(--border);background:#FAFAFF;transition:all .2s ease;}
  .chip.active{background:var(--indigo);color:#fff;border-color:var(--indigo);}
  .fade-in{animation:fadeIn .45s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .float-slow{animation:floaty 6s ease-in-out infinite;}
  @keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
  .spin-slow{animation:spin 30s linear infinite;}
  .spin-slower{animation:spin 55s linear infinite reverse;}
  @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  .pulse-dot{animation:pulseDot 2s ease-in-out infinite;}
  @keyframes pulseDot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.55;transform:scale(1.35);}}
  .skill-bar{height:6px;border-radius:99px;background:#EEEFFA;overflow:hidden;}
  .skill-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#3A2FB8,#22D3EE);}
  .tab-underline{position:relative;}
  .tab-underline.active::after{content:'';position:absolute;left:0;right:0;bottom:-9px;height:3px;border-radius:99px;background:linear-gradient(90deg,#3A2FB8,#8B5CF6);}
  .no-scrollbar::-webkit-scrollbar{display:none;}
  .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none;}
</style>

/* Signature element: Orbit Ring — represents the global network visually, used across pages */
const OrbitRing = ({ size=260, dark=false }) => {
  const dots = [
    {a:10,r:1}, {a:70,r:1}, {a:140,r:1}, {a:200,r:1}, {a:250,r:1}, {a:310,r:1},
    {a:40,r:2}, {a:160,r:2}, {a:280,r:2},
  ];
  const c = size/2;
  return (
    <div style={{width:size, height:size}} className="relative shrink-0">
      <div className="absolute inset-0 rounded-full spin-slow" style={{border:"1.5px dashed rgba(139,92,246,0.35)"}}></div>
      <div className="absolute rounded-full spin-slower" style={{inset:size*0.11, border:"1.5px dashed rgba(34,211,238,0.4)"}}></div>
      <div className="absolute rounded-full" style={{inset:size*0.24, background: dark ? "radial-gradient(circle at 35% 30%, rgba(139,92,246,0.35), rgba(10,12,34,0.9))" : "radial-gradient(circle at 35% 30%, #EFE9FF, #DCE8FF)"}}></div>
      <IconGlobe size={size*0.22} className={"absolute " + (dark? "text-white/80":"text-[var(--indigo)]")} style={{left:c-size*0.11, top:c-size*0.11}} />
      {dots.map((d,i)=>{
        const rad = size*0.5 - (d.r===1? size*0.005 : size*0.005) - (d.r===1? 0 : size*0.11);
        const radius = d.r===1 ? size*0.5 : size*0.39;
        const x = c + radius*Math.cos(d.a*Math.PI/180) - 5;
        const y = c + radius*Math.sin(d.a*Math.PI/180) - 5;
        return <span key={i} className="absolute w-2.5 h-2.5 rounded-full pulse-dot" style={{left:x, top:y, background: i%2? "#8B5CF6":"#22D3EE", animationDelay:(i*0.3)+"s"}}></span>;
      })}
    </div>
  );
};

const ProgressRing = ({ pct=78, size=110, label="Career Ready" }) => {
  const r = (size-14)/2, c = 2*Math.PI*r;
  return (
    <div className="relative" style={{width:size,height:size}}>
      <svg width={size} height={size} className="-rotate-90">
        <circle cx={size/2} cy={size/2} r={r} stroke="#EEEFFA" strokeWidth="10" fill="none"/>
        <circle cx={size/2} cy={size/2} r={r} stroke="url(#grad1)" strokeWidth="10" fill="none"
          strokeDasharray={c} strokeDashoffset={c - (pct/100)*c} strokeLinecap="round"
          style={{transition:"stroke-dashoffset 1s ease"}} />
        <defs><linearGradient id="grad1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor="#3A2FB8"/><stop offset="100%" stopColor="#22D3EE"/>
        </linearGradient></defs>
      </svg>
      <div className="absolute inset-0 flex flex-col items-center justify-center">
        <span className="font-display text-xl font-bold">{pct}%</span>
        <span className="text-[10px] text-[var(--ink-muted)] text-center leading-tight px-2">{label}</span>
      </div>
    </div>
  );
};

                <div className="flex items-center justify-between"><p className="text-sm font-semibold truncate">{c.name}</p><span className="text-[10px] text-[var(--ink-muted)] shrink-0">{c.time}</span></div>
                <p className="text-xs text-[var(--ink-muted)] truncate">{c.last}</p>
              </div>
              {c.unread>0 && <span className="w-5 h-5 rounded-full bg-[var(--indigo)] text-white text-[10px] flex items-center justify-center shrink-0">{c.unread}</span>}
            </button>
          ))}
        </div>
      </div>

      <div className="hidden sm:flex flex-col flex-1 min-w-0">
        <div className="flex items-center gap-3 px-5 py-4 border-b border-[var(--border)]">
          <Avatar seed={active.name} size={38}/>
          <div className="min-w-0"><p className="text-sm font-semibold truncate">{active.name}</p><p className="text-[11px] text-[var(--ink-muted)]">{active.online?"Active now":"Offline"}</p></div>
        </div>
        <div className="flex-1 overflow-y-auto p-5 flex flex-col gap-3">
          {(THREAD[activeId]||[]).map((m,i)=>(
            <div key={i} className={"max-w-[70%] px-4 py-2.5 rounded-2xl text-sm leading-snug " + (m.from==="me" ? "self-end btn-primary rounded-br-md" : "self-start bg-[#F1F2FA] rounded-bl-md")}>
              {m.text}
            </div>
          ))}
        </div>
        <div className="p-4 border-t border-[var(--border)] flex items-center gap-2">
          <button className="p-2 text-[var(--ink-muted)] hover:text-[var(--indigo)]"><IconPaperclip size={19}/></button>
          <button className="p-2 text-[var(--ink-muted)] hover:text-[var(--indigo)]"><IconSmile size={19}/></button>
          <input value={draft} onChange={e=>setDraft(e.target.value)} placeholder="Type a message..." className="flex-1 bg-[#F1F2FA] rounded-full px-4 py-2.5 text-sm outline-none"/>
          <button onClick={()=>setDraft("")} className="w-10 h-10 rounded-full btn-primary flex items-center justify-center shrink-0"><IconSend size={16}/></button>
        </div>
      </div>
    </div>
  );
};

/* ============================= NOTIFICATIONS PAGE ============================= */
const NotificationsPage = () => (
  <div className="flex flex-col gap-3">
    <SectionTitle title="Notifications" sub="Stay on top of connections, opportunities and activity."/>
    <div className="card divide-y divide-[var(--border)]">
      {NOTIFICATIONS.map(n=>(
        <div key={n.id} className="flex items-start gap-3 px-4 py-4 hover:bg-[#F7F7FD] transition cursor-pointer">
          <div className={"w-10 h-10 rounded-full flex items-center justify-center shrink-0 " + (n.unread ? "bg-indigo-100 text-[var(--indigo)]" : "bg-[#F1F2FA] text-[var(--ink-muted)]")}>
            <n.icon size={17}/>
          </div>
          <div className="flex-1 min-w-0"><p className="text-sm">{n.text}</p><span className="text-xs text-[var(--ink-muted)]">{n.time}</span></div>
          {n.unread && <span className="w-2 h-2 rounded-full bg-[var(--purple)] mt-2 shrink-0"></span>}
        </div>
      ))}
    </div>
  </div>
);

/* ============================= SAVED PAGE ============================= */
const SavedPage = () => (
  <div className="flex flex-col gap-6">
    <SectionTitle title="Saved Items" sub="Posts, internships and hackathons you've bookmarked."/>
    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
      <InternshipCard i={INTERNSHIPS[0]}/>
      <HackathonCard h={HACKATHONS[1]}/>
    </div>
    <PostCard post={POSTS[0]}/>
  </div>
);

/* ============================= MY NETWORK PAGE ============================= */
const NetworkPage = () => (
  <div className="flex flex-col gap-6">
    <SectionTitle title="My Network" sub={`${ME.connections} connections across 22 countries.`}/>
    <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
      {STUDENTS.map(s=><StudentCard key={s.id} s={s}/>)}
    </div>
  </div>
);

/* ============================= CAREER GROWTH PAGE ============================= */
const CareerGrowthPage = () => {
  const steps = ["Profile","Skills","Projects","Hackathons","Experience","Internships","Career Ready"];
  const doneUpTo = 5;
  return (
    <div className="flex flex-col gap-6">
      <SectionTitle eyebrow="Grow" title="Your Career Journey" sub="Track your progress from student profile to career-ready."/>

      <div className="card p-6 flex flex-col md:flex-row items-center gap-8">
        <ProgressRing pct={78} size={140} label="Career Readiness"/>
        <div className="flex-1 w-full">
          <div className="flex items-center justify-between flex-wrap gap-y-4">
            {steps.map((s,i)=>(
              <React.Fragment key={s}>
                <div className="flex flex-col items-center gap-1.5 min-w-[64px]">
                  <div className={"w-9 h-9 rounded-full flex items-center justify-center text-xs font-bold " + (i<doneUpTo ? "aurora-bg text-white" : i===doneUpTo ? "bg-white border-2 border-[var(--indigo)] text-[var(--indigo)]" : "bg-[#F1F2FA] text-[var(--ink-muted)]")}>
                    {i<doneUpTo ? <IconCheck size={15}/> : i+1}
                  </div>
                  <span className="text-[10px] text-center text-[var(--ink-muted)] leading-tight">{s}</span>
                </div>
                {i<steps.length-1 && <div className={"flex-1 h-0.5 mx-1 rounded " + (i<doneUpTo-1 ? "aurora-bg" : "bg-[#EEEFFA]")}></div>}
              </React.Fragment>
            ))}
          </div>
        </div>
      </div>

      <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
        {[["Profile Strength","92%"],["Skills Progress","74%"],["Projects Completed","14"],["Hackathons Joined","9"],["Connections","512"],["Readiness Score","78/100"]].map(([l,v])=>(
          <div key={l} className="card p-4">
            <p className="font-display text-xl font-bold">{v}</p>
            <p className="text-xs text-[var(--ink-muted)] mt-1">{l}</p>
          </div>
        ))}
      </div>

      <div className="card p-5">
        <div className="flex items-center gap-2 mb-4">
          <IconSparkle size={18} className="text-[var(--purple)]"/>
          <h3 className="font-display font-semibold">Based on your profile</h3>
        </div>
        <div className="flex flex-col gap-2.5">
          {["Complete a backend project","Join an AI hackathon","Improve Python skills","Connect with 5 ML students"].map(r=>(
            <div key={r} className="flex items-center gap-3 bg-[#F7F7FD] rounded-xl px-4 py-3">
              <IconTarget size={16} className="text-[var(--indigo)] shrink-0"/>
              <span className="text-sm flex-1">{r}</span>
              <button className="text-xs font-semibold text-[var(--indigo)] hover:underline shrink-0">Start</button>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

/* ============================= SETTINGS (minimal placeholder page) ============================= */
const SettingsPage = () => (
  <div className="flex flex-col gap-6">
    <SectionTitle title="Settings" sub="Prototype only — no real settings are saved."/>
    <div className="card p-5 flex flex-col gap-4">
      {["Account","Privacy","Notifications","Appearance"].map(s=>(
        <div key={s} className="flex items-center justify-between border-b border-[var(--border)] last:border-0 pb-4 last:pb-0">
          <span className="text-sm font-medium">{s}</span>
          <IconChevronDown size={16} className="-rotate-90 text-[var(--ink-muted)]"/>
        </div>
      ))}
    </div>
  </div>
);

/* ============================= MOBILE BOTTOM NAV ============================= */
const MobileNav = ({ page, setPage }) => {
  const map = { home:IconHome, explore:IconCompass, hackathons:IconTrophy, messages:IconMessage, profile:IconUsers };
  return (
    <nav className="lg:hidden fixed bottom-0 left-0 right-0 z-40 glass border-t border-[var(--border)] flex items-center justify-around py-2">
      {MOBILE_NAV.map(k=>{
        const Ic = map[k];
        const activeKey = k==="profile" ? "profile" : k;
        return (
          <button key={k} onClick={()=>setPage(activeKey)} className={"flex flex-col items-center gap-1 px-3 py-1 rounded-xl " + (page===activeKey ? "text-[var(--indigo)]" : "text-[var(--ink-muted)]")}>
            <Ic size={20}/>
            <span className="text-[10px] font-medium capitalize">{k}</span>
          </button>
        );
      })}
    </nav>
  );
};

/* ============================= APP ============================= */
const PAGE_TITLES = {
  home:"Home", explore:"Explore", network:"My Network", hackathons:"Hackathons", internships:"Internships",
  projects:"Projects", communities:"Communities", messages:"Messages", notifications:"Notifications",
  saved:"Saved", profile:"Profile", career:"Career Growth", settings:"Settings",
};

const App = () => {
  const [page, setPage] = useState("home");
  const [mobileOpen, setMobileOpen] = useState(false);

  useEffect(()=>{ window.scrollTo(0,0); }, [page]);

  const renderPage = () => {
    switch(page){
      case "home": return <HomePage setPage={setPage}/>;
      case "explore": return <ExplorePage/>;
      case "network": return <NetworkPage/>;
      case "hackathons": return <HackathonsPage/>;
      case "internships": return <InternshipsPage/>;
      case "projects": return <ProjectsPage/>;
      case "communities": return <CommunitiesPage/>;
      case "messages": return <MessagesPage/>;
      case "notifications": return <NotificationsPage/>;
      case "saved": return <SavedPage/>;
      case "profile": return <ProfilePage/>;
      case "career": return <CareerGrowthPage/>;
      case "settings": return <SettingsPage/>;
      default: return <HomePage setPage={setPage}/>;
    }
  };

  const showRightSidebar = ["home","explore","network","saved"].includes(page);

  return (
    <div className="min-h-screen pb-20 lg:pb-0">
      <TopNav page={page} setPage={setPage} onMenu={()=>setMobileOpen(true)}/>
      <div className="max-w-[1400px] mx-auto px-4 md:px-6 py-6 flex gap-6 items-start">
        <LeftSidebar page={page} setPage={setPage} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen}/>
        <main className="flex-1 min-w-0 fade-in" key={page}>
          {renderPage()}
        </main>
        {showRightSidebar && <RightSidebar setPage={setPage}/>}
      </div>
      <MobileNav page={page} setPage={setPage}/>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
